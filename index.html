<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>予定リスト</title>

<!-- ホーム画面に追加したときにアプリらしく見えるための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="予定リスト" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Crect x='22' y='28' width='56' height='46' rx='6' fill='white'/%3E%3Crect x='22' y='28' width='56' height='14' rx='6' fill='%234338ca'/%3E%3Ccircle cx='34' cy='20' r='4' fill='%234338ca'/%3E%3Ccircle cx='66' cy='20' r='4' fill='%234338ca'/%3E%3C/svg%3E" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  input[type="date"], input[type="time"] { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---- アイコン(lucide-reactの代わりに軽量SVGを直書き) ---- */
const Icon = ({ path, className = "w-4 h-4", strokeWidth = 2 }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth}
       strokeLinecap="round" strokeLinejoin="round" className={className}>
    {path}
  </svg>
);
const PlusIcon = (p) => <Icon {...p} path={<><path d="M12 5v14"/><path d="M5 12h14"/></>} />;
const TrashIcon = (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></>} />;
const CheckIcon = (p) => <Icon {...p} path={<path d="M20 6 9 17l-5-5"/>} />;
const CalendarIcon = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></>} />;
const ListIcon = (p) => <Icon {...p} path={<><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></>} />;
const ChevronLeftIcon = (p) => <Icon {...p} path={<path d="M15 18l-6-6 6-6"/>} />;
const ChevronRightIcon = (p) => <Icon {...p} path={<path d="M9 18l6-6-6-6"/>} />;
const PencilIcon = (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />;
const XIcon = (p) => <Icon {...p} path={<><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>} />;

/* ---- 保存用ラッパー:iPhone(Safari)のlocalStorageに保存 ---- */
const storage = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
  },
};

const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

function todayISO() { return new Date().toISOString().slice(0, 10); }

function formatDayLabel(isoDate) {
  const d = new Date(isoDate + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
}

function dateDiffFromToday(isoDate) {
  const d = new Date(isoDate + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}

function timeLabel(t) {
  if (!t) return null;
  if (t === "未定") return "未定";
  return t;
}

function computeWeekLanes(weekSlots, multiDayItems) {
  const bars = [];
  multiDayItems.forEach((item) => {
    let startCol = -1, endCol = -1;
    weekSlots.forEach((iso, idx) => {
      if (!iso) return;
      if (iso >= item.startDate && iso <= item.endDate) {
        if (startCol === -1) startCol = idx;
        endCol = idx;
      }
    });
    if (startCol === -1) return;
    bars.push({
      item, startCol, span: endCol - startCol + 1,
      isStart: weekSlots[startCol] === item.startDate,
      isEnd: weekSlots[endCol] === item.endDate,
    });
  });
  bars.sort((a, b) => a.startCol - b.startCol || b.span - a.span);
  const lanes = [];
  bars.forEach((bar) => {
    const laneIdx = lanes.findIndex((lane) =>
      lane.every((b) => bar.startCol > b.startCol + b.span - 1 || bar.startCol + bar.span - 1 < b.startCol)
    );
    if (laneIdx === -1) lanes.push([bar]);
    else lanes[laneIdx].push(bar);
  });
  return lanes;
}

function ScheduleApp() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);

  const [title, setTitle] = useState("");
  const [startDate, setStartDate] = useState(todayISO());
  const [startTime, setStartTime] = useState("");
  const [endDate, setEndDate] = useState(todayISO());
  const [endTime, setEndTime] = useState("");
  const [editingId, setEditingId] = useState(null);

  const [filter, setFilter] = useState("all");
  const [view, setView] = useState("list");
  const [cursor, setCursor] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });

  const [freeMemo, setFreeMemo] = useState("");
  const memoSaveTimer = useRef(null);

  useEffect(() => {
    try {
      const result = storage.get("schedule:items");
      if (result) {
        const parsed = JSON.parse(result.value);
        const migrated = parsed.map((it) =>
          it.startDate ? it : { ...it, startDate: it.date, startTime: it.time || "", endDate: it.date, endTime: "" }
        );
        setItems(migrated);
      }
    } catch (e) {}
    try {
      const memoResult = storage.get("schedule:freeMemo");
      if (memoResult) setFreeMemo(memoResult.value);
    } catch (e) {}
    setLoading(false);
  }, []);

  const persist = (next) => {
    setItems(next);
    storage.set("schedule:items", JSON.stringify(next));
  };

  const persistMemo = (text) => {
    setFreeMemo(text);
    if (memoSaveTimer.current) clearTimeout(memoSaveTimer.current);
    memoSaveTimer.current = setTimeout(() => storage.set("schedule:freeMemo", text), 500);
  };

  const sortItems = (arr) => [...arr].sort((a, b) => {
    const dateCmp = a.startDate.localeCompare(b.startDate);
    if (dateCmp !== 0) return dateCmp;
    const ta = a.startTime === "未定" ? "24:99" : a.startTime || "";
    const tb = b.startTime === "未定" ? "24:99" : b.startTime || "";
    return ta.localeCompare(tb);
  });

  const addItem = () => {
    if (!title.trim()) return;
    const safeEndDate = endDate && endDate >= startDate ? endDate : startDate;

    if (editingId) {
      const next = sortItems(items.map((it) =>
        it.id === editingId
          ? { ...it, title: title.trim(), startDate, startTime, endDate: safeEndDate, endTime }
          : it
      ));
      persist(next);
      cancelEdit();
      return;
    }

    const newItem = {
      id: Date.now().toString(), title: title.trim(),
      startDate, startTime, endDate: safeEndDate, endTime, done: false,
    };
    persist(sortItems([...items, newItem]));
    setTitle(""); setStartTime(""); setEndTime(""); setEndDate(startDate);
  };

  const startEdit = (item) => {
    setEditingId(item.id);
    setTitle(item.title);
    setStartDate(item.startDate);
    setStartTime(item.startTime || "");
    setEndDate(item.endDate || item.startDate);
    setEndTime(item.endTime || "");
  };

  const cancelEdit = () => {
    setEditingId(null); setTitle("");
    setStartDate(todayISO()); setStartTime("");
    setEndDate(todayISO()); setEndTime("");
  };

  const toggleDone = (id) => persist(items.map((it) => (it.id === id ? { ...it, done: !it.done } : it)));
  const deleteItem = (id) => { persist(items.filter((it) => it.id !== id)); if (editingId === id) cancelEdit(); };

  const rangeInfo = (item) => {
    const spansMultipleDays = item.endDate && item.endDate !== item.startDate;
    const isPast = dateDiffFromToday(spansMultipleDays ? item.endDate : item.startDate) < 0;
    const startTag = dateDiffFromToday(item.startDate) === 0 ? "今日" : dateDiffFromToday(item.startDate) === 1 ? "明日" : null;
    const dateLabel = spansMultipleDays ? `${formatDayLabel(item.startDate)} 〜 ${formatDayLabel(item.endDate)}` : formatDayLabel(item.startDate);
    const sTime = timeLabel(item.startTime), eTime = timeLabel(item.endTime);
    let timeStr = null;
    if (sTime && eTime) timeStr = `${sTime} 〜 ${eTime}`;
    else if (sTime) timeStr = sTime;
    else if (eTime) timeStr = `〜 ${eTime}`;
    return { dateLabel, timeStr, tag: spansMultipleDays ? null : startTag, isPast };
  };

  const filtered = items.filter((it) => filter === "active" ? !it.done : filter === "done" ? it.done : true);
  const activeCount = items.filter((it) => !it.done).length;

  const singleDayItemsByDate = {};
  const multiDayItems = [];
  items.forEach((it) => {
    if (it.endDate && it.endDate !== it.startDate) multiDayItems.push(it);
    else (singleDayItemsByDate[it.startDate] ||= []).push(it);
  });

  const monthLabel = `${cursor.year}年 ${cursor.month + 1}月`;
  const firstOfMonth = new Date(cursor.year, cursor.month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const todayStr = todayISO();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(`${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

  const BAR_H = 16, BAR_GAP = 3, laneHeight = BAR_H + BAR_GAP;

  const shiftMonth = (delta) => {
    let m = cursor.month + delta, y = cursor.year;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center bg-slate-50"><span className="text-slate-400 text-sm">読み込み中...</span></div>;
  }

  return (
    <div className="min-h-screen bg-slate-50 px-4 py-8">
      <div className="max-w-md mx-auto">
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-2">
            <CalendarIcon className="w-6 h-6 text-indigo-600" />
            <h1 className="text-xl font-semibold text-slate-800">予定リスト</h1>
          </div>
          <div className="flex bg-white border border-slate-200 rounded-lg p-0.5">
            <button onClick={() => setView("list")} className={`flex items-center gap-1 text-xs px-3 py-1.5 rounded-md transition-colors ${view === "list" ? "bg-indigo-600 text-white" : "text-slate-500"}`}>
              <ListIcon className="w-3.5 h-3.5" />リスト
            </button>
            <button onClick={() => setView("calendar")} className={`flex items-center gap-1 text-xs px-3 py-1.5 rounded-md transition-colors ${view === "calendar" ? "bg-indigo-600 text-white" : "text-slate-500"}`}>
              <CalendarIcon className="w-3.5 h-3.5" />カレンダー
            </button>
          </div>
        </div>

        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-5">
          {editingId && (
            <div className="flex items-center justify-between mb-2 px-0.5">
              <span className="text-xs text-indigo-600 font-medium">予定を編集中</span>
              <button onClick={cancelEdit} className="flex items-center gap-0.5 text-xs text-slate-400 hover:text-slate-600">
                <XIcon className="w-3.5 h-3.5" />キャンセル
              </button>
            </div>
          )}
          <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="予定を入力(例:出張)"
            className="w-full text-sm px-3 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-3" />

          <div className="flex items-center gap-2 mb-2">
            <span className="text-xs text-slate-400 w-8 shrink-0">開始</span>
            <input type="date" value={startDate} onChange={(e) => { setStartDate(e.target.value); if (endDate < e.target.value) setEndDate(e.target.value); }}
              className="flex-1 text-sm px-2.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <input type="time" value={startTime === "未定" ? "" : startTime} onChange={(e) => setStartTime(e.target.value)} disabled={startTime === "未定"}
              className={`text-sm px-2.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 w-[110px] ${startTime === "未定" ? "bg-slate-50 text-slate-300" : ""}`} />
            <button type="button" onClick={() => setStartTime(startTime === "未定" ? "" : "未定")}
              className={`text-xs px-2.5 py-2 rounded-lg border transition-colors shrink-0 ${startTime === "未定" ? "bg-indigo-600 border-indigo-600 text-white" : "bg-white border-slate-200 text-slate-500"}`}>未定</button>
          </div>

          <div className="flex items-center gap-2 mb-3">
            <span className="text-xs text-slate-400 w-8 shrink-0">終了</span>
            <input type="date" value={endDate} min={startDate} onChange={(e) => setEndDate(e.target.value)}
              className="flex-1 text-sm px-2.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <input type="time" value={endTime === "未定" ? "" : endTime} onChange={(e) => setEndTime(e.target.value)} disabled={endTime === "未定"}
              className={`text-sm px-2.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 w-[110px] ${endTime === "未定" ? "bg-slate-50 text-slate-300" : ""}`} />
            <button type="button" onClick={() => setEndTime(endTime === "未定" ? "" : "未定")}
              className={`text-xs px-2.5 py-2 rounded-lg border transition-colors shrink-0 ${endTime === "未定" ? "bg-indigo-600 border-indigo-600 text-white" : "bg-white border-slate-200 text-slate-500"}`}>未定</button>
          </div>

          <button onClick={addItem} className="w-full flex items-center justify-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors">
            {editingId ? <><CheckIcon className="w-4 h-4" />更新</> : <><PlusIcon className="w-4 h-4" />追加</>}
          </button>
        </div>

        {view === "list" ? (
          <>
            <div className="flex items-center justify-between mb-3 px-1">
              <div className="flex gap-1">
                {[{ key: "all", label: "すべて" }, { key: "active", label: "未完了" }, { key: "done", label: "完了" }].map((f) => (
                  <button key={f.key} onClick={() => setFilter(f.key)}
                    className={`text-xs px-3 py-1.5 rounded-full transition-colors ${filter === f.key ? "bg-indigo-600 text-white" : "bg-white text-slate-500 border border-slate-200"}`}>{f.label}</button>
                ))}
              </div>
              <span className="text-xs text-slate-400">残り{activeCount}件</span>
            </div>

            <div className="space-y-2">
              {filtered.length === 0 && <div className="text-center text-sm text-slate-400 py-12">予定はまだありません</div>}
              {filtered.map((item) => {
                const { dateLabel, timeStr, tag, isPast } = rangeInfo(item);
                return (
                  <div key={item.id} className={`flex items-center gap-3 bg-white rounded-xl border border-slate-200 px-3 py-3 ${item.done ? "opacity-50" : ""}`}>
                    <button onClick={() => toggleDone(item.id)}
                      className={`shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${item.done ? "bg-indigo-600 border-indigo-600" : "border-slate-300"}`}>
                      {item.done && <CheckIcon className="w-3 h-3 text-white" strokeWidth={3} />}
                    </button>
                    <div className="flex-1 min-w-0">
                      <p className={`text-sm text-slate-800 truncate ${item.done ? "line-through" : ""}`}>{item.title}</p>
                      <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                        <span className={`text-xs ${isPast && !item.done ? "text-red-500" : "text-slate-400"}`}>{dateLabel}</span>
                        {timeStr && <span className={`text-xs ${timeStr.includes("未定") ? "text-amber-600" : "text-slate-400"}`}>{timeStr}</span>}
                        {tag && <span className="text-xs bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">{tag}</span>}
                      </div>
                    </div>
                    <button onClick={() => startEdit(item)} className="shrink-0 text-slate-300 hover:text-indigo-600 transition-colors p-1"><PencilIcon className="w-4 h-4" /></button>
                    <button onClick={() => deleteItem(item.id)} className="shrink-0 text-slate-300 hover:text-red-500 transition-colors p-1"><TrashIcon className="w-4 h-4" /></button>
                  </div>
                );
              })}
            </div>
          </>
        ) : (
          <>
            <div className="flex items-center justify-between mb-3 px-1">
              <button onClick={() => shiftMonth(-1)} className="p-1.5 rounded-lg hover:bg-slate-200 text-slate-500"><ChevronLeftIcon className="w-4 h-4" /></button>
              <span className="text-sm font-medium text-slate-700">{monthLabel}</span>
              <button onClick={() => shiftMonth(1)} className="p-1.5 rounded-lg hover:bg-slate-200 text-slate-500"><ChevronRightIcon className="w-4 h-4" /></button>
            </div>

            <div className="grid grid-cols-7 mb-1">
              {WEEKDAYS.map((w, i) => (
                <div key={w} className={`text-center text-xs py-1 ${i === 0 ? "text-red-400" : i === 6 ? "text-blue-400" : "text-slate-400"}`}>{w}</div>
              ))}
            </div>

            <div className="mb-4 space-y-1">
              {weeks.map((weekSlots, wi) => {
                const lanes = computeWeekLanes(weekSlots, multiDayItems);
                const barAreaHeight = lanes.length * laneHeight;
                return (
                  <div key={wi} className="relative">
                    <div className="grid grid-cols-7 gap-1">
                      {weekSlots.map((iso, idx) => {
                        if (!iso) return <div key={idx} className="min-h-[90px]" />;
                        const dayItems = singleDayItemsByDate[iso] || [];
                        const isToday = iso === todayStr;
                        const dayNum = parseInt(iso.slice(-2), 10);
                        const visible = dayItems.slice(0, 4);
                        const extra = dayItems.length - visible.length;
                        return (
                          <div key={iso} className={`min-h-[90px] rounded-lg border p-1 flex flex-col gap-0.5 ${isToday ? "bg-indigo-50 border-indigo-200" : "bg-white border-slate-200"}`}>
                            <span className={`text-[11px] font-medium px-0.5 ${isToday ? "text-indigo-700" : "text-slate-500"}`}>{dayNum}</span>
                            {barAreaHeight > 0 && <div style={{ height: barAreaHeight }} />}
                            {visible.map((item) => (
                              <button key={item.id} onClick={() => toggleDone(item.id)}
                                className={`text-center text-[10px] leading-tight px-1 py-0.5 rounded truncate ${item.done ? "bg-slate-100 text-slate-400 line-through" : "bg-indigo-100 text-indigo-700"}`}
                                title={item.title}>
                                {item.startTime && <span className="opacity-70">{timeLabel(item.startTime)} </span>}{item.title}
                              </button>
                            ))}
                            {extra > 0 && <span className="text-[10px] text-slate-400 px-1">+{extra}件</span>}
                          </div>
                        );
                      })}
                    </div>
                    {lanes.length > 0 && (
                      <div className="absolute left-0 right-0 grid grid-cols-7 gap-1" style={{ top: "18px", columnGap: "4px", rowGap: `${BAR_GAP}px` }}>
                        {lanes.map((lane, li) => lane.map((bar) => (
                          <button key={bar.item.id} onClick={() => toggleDone(bar.item.id)} title={bar.item.title}
                            style={{ gridColumn: `${bar.startCol + 1} / span ${bar.span}`, gridRow: li + 1, height: BAR_H }}
                            className={`text-[10px] leading-none truncate px-1.5 flex items-center justify-center ${bar.item.done ? "bg-slate-200 text-slate-400 line-through" : "bg-indigo-500 text-white"} ${bar.isStart ? "rounded-l-md" : ""} ${bar.isEnd ? "rounded-r-md" : ""}`}>
                            {bar.item.title}
                          </button>
                        )))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}

        <div className="mt-5">
          <p className="text-xs text-slate-400 mb-1.5 px-1">メモ</p>
          <textarea value={freeMemo} onChange={(e) => persistMemo(e.target.value)} placeholder="自由にメモを書けます..." rows={5}
            className="w-full text-sm px-3 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none text-slate-700" />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ScheduleApp />);
</script>
</body>
</html>
